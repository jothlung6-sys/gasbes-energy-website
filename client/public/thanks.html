<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Thanks — Gasbes Energy</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <style>
    :root { --green:#125C13; --coffee:#8A5A44; }
    html,body{height:100%}
    body{margin:0;display:grid;place-items:center;background:#fafafa;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,sans-serif}
    .card{max-width:560px;padding:32px 28px;border-radius:16px;background:#fff;box-shadow:0 10px 32px rgba(0,0,0,.08)}
    h1{margin:0 0 8px;color:var(--green);font-size:28px}
    p{margin:0 0 12px;color:#333;line-height:1.5}
    .btn{display:inline-block;margin-top:10px;padding:10px 16px;border-radius:10px;background:var(--green);color:#fff;text-decoration:none}
    .muted{color:#666;font-size:14px}
  </style>
</head>
<body>
  <div class="card">
    <h1>Thank you for contacting Gasbes Energy</h1>
    <p>We've received your message and will get back to you shortly.</p>
    <p class="muted">Tip: if you don't see our reply within a day, please check your spam folder.</p>
    <a class="btn" href="/">Back to Home</a>
  </div>
</body>
</html>
